# SASP syslog-ng Configuration
# Receives syslog from network devices, writes to files and forwards to Kafka.

@version: 4.2
@include "scl.conf"

# --- Global options ---
options {
    chain-hostnames(no);
    keep-hostname(yes);
    use-dns(no);
    use-fqdn(no);
    stats-freq(3600);
    flush-lines(100);
    time-reopen(10);
};

# --- Sources ---
source s_network {
    # UDP syslog (RFC3164 and RFC5424)
    network(
        transport("udp")
        port(514)
        flags(no-parse)
    );
    # TCP syslog
    network(
        transport("tcp")
        port(514)
        flags(no-parse)
    );
};

# --- Parsers ---
parser p_syslog {
    syslog-parser(flags(guess-timezone));
};

# --- Destinations ---

# File destination: daily rotation by host
destination d_file {
    file(
        "/var/log/syslog-raw/${YEAR}-${MONTH}-${DAY}/${HOST}.log"
        create-dirs(yes)
        dir-perm(0755)
        perm(0644)
        template("${ISODATE} ${HOST} ${MSGHDR}${MSG}\n")
    );
};

# Kafka destination via kafkacat/kcat pipe
# Using program() is safer than the native kafka driver (no librdkafka dependency).
# If kcat is unavailable, this destination silently fails and the file dest still works.
destination d_kafka {
    program(
        "/usr/bin/kcat -P -b <S2_IP>:9092 -t syslog-raw -k ${HOST}"
        template("${ISODATE}\t${HOST}\t${FACILITY}\t${LEVEL}\t${MSGHDR}${MSG}\n")
        flags(no-multi-line)
    );
};

# Fallback file destination when Kafka is unavailable
destination d_fallback {
    file(
        "/var/log/syslog-raw/kafka-fallback.log"
        create-dirs(yes)
        template("${ISODATE}\t${HOST}\t${FACILITY}\t${LEVEL}\t${MSGHDR}${MSG}\n")
    );
};

# --- Log paths ---

# Always write to file
log {
    source(s_network);
    parser(p_syslog);
    destination(d_file);
};

# Forward to Kafka (best-effort; file dest is the reliable path)
log {
    source(s_network);
    parser(p_syslog);
    destination(d_kafka);
    flags(flow-control);
};
