# SASP Server 2 (C240 M5) - Data Collection & Training
# <S2_IP>

version: '3.8'

services:
  # Zookeeper for Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./data/zookeeper/data:/var/lib/zookeeper/data
      - ./data/zookeeper/logs:/var/lib/zookeeper/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kafka message broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://<S2_IP>:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 720  # 30 days
      KAFKA_LOG_RETENTION_BYTES: 53687091200  # 50GB
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GoFlow2 - NetFlow collector
  goflow2:
    image: netsampler/goflow2:latest
    container_name: goflow2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "2055:2055/udp"   # NetFlow v5/v9
      - "6343:6343/udp"   # sFlow
    command: >
      -transport=kafka
      -transport.kafka.brokers=kafka:9092
      -transport.kafka.topic=netflow-raw
      -format=json
    restart: unless-stopped

  # Syslog collector
  syslog:
    image: balabit/syslog-ng:latest
    container_name: syslog
    ports:
      - "514:514/udp"
      - "514:514/tcp"
    volumes:
      - ./configs/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - ./data/syslog:/var/log
    restart: unless-stopped

  # Sanitizer service
  sanitizer:
    build:
      context: ../../sanitizer
      dockerfile: Dockerfile
    container_name: sanitizer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INPUT_TOPICS: netflow-raw,ise-raw,syslog-raw
      OUTPUT_TOPIC_SUFFIX: -sanitized
      STRICT_MODE: "true"
    restart: unless-stopped

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  syslog-data:

networks:
  default:
    name: sasp-network
