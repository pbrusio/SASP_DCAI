[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sasp"
version = "0.1.0"
description = "Secure AI Security Platform — AI-powered security operations with NVIDIA Morpheus and LangGraph agents"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "SASP Team"},
]

dependencies = [
    "pydantic>=2.0",
    "kafka-python>=2.0.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.8",
]
ml = [
    "torch>=2.1",
    "onnx>=1.15",
    "scikit-learn>=1.3",
    "pandas>=2.1",
    "numpy>=1.24",
]
agents = [
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "openai>=1.0",
]
ui = [
    "gradio>=4.0",
]

[project.scripts]
sasp-sanitizer = "sasp.sanitizer.cli:main"
sasp-agent-runner = "sasp.agents.cli:main"
sasp-health = "sasp.infrastructure.health:main"

[tool.setuptools.packages.find]
include = ["sasp*"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["sasp/tests"]
markers = [
    "adversarial: prompt injection and evasion tests",
    "integration: requires running infrastructure (Kafka, Triton, etc.)",
    "requires_kafka: needs a live Kafka broker",
    "requires_triton: needs a live Triton Inference Server",
    "requires_llm: needs an LLM endpoint (LM Studio, vLLM, etc.)",
]

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "S101",  # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"sasp/tests/**/*.py" = ["S101"]

# --- mypy ---
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
